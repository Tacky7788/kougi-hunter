<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"></head><body>
<title>マルチハンター</title>
<meta name="theme-color" content="#14181A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column; 3D canvas behind HUD; hub screens as full overlays */
:root{--bg:#14181A;--panel:#1F262A;--panel2:#273035;--line:#3A454B;--text:#F3EFE6;--muted:#A8B0B3;--accent:#F0A23B;--cool:#4FB3BF;--hp:#5CC98A;--st:#E8C547;--mon:#E2574C;--disp:'Dela Gothic One','Noto Sans JP',sans-serif;--body:'Noto Sans JP',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
h1,h2,.disp{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:5}
.screen.on{display:flex}
.pad{padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:12px;letter-spacing:.28em;color:var(--muted)}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:14px;border:none;font-weight:700;font-size:17px;cursor:pointer;width:100%;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.ghost{background:var(--panel);color:var(--text);font-weight:400;font-size:15px;min-height:48px}
.btn.small{min-height:40px;font-size:14px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
/* title */
#sTitle{justify-content:flex-end;overflow:hidden;background:linear-gradient(to bottom,rgba(20,24,26,0) 25%,rgba(20,24,26,.92) 70%)}
#titleArt{position:absolute;inset:0;pointer-events:none}
#sTitle .inner{position:relative;display:flex;flex-direction:column;gap:14px}
#sTitle h1{font-size:56px;line-height:1.02}
/* hub */
#hubHead{display:flex;align-items:center;gap:12px;padding-bottom:14px}
#hubHead h2{font-size:22px;flex:1}
.coins{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);font-variant-numeric:tabular-nums;font-weight:700}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--st);display:inline-block}
#tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-bottom:14px}
#tabs button{min-height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
#tabs button.on{background:var(--panel2);color:var(--text);font-weight:700}
#hubBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:12px;scrollbar-width:none}
#hubBody::-webkit-scrollbar{display:none}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.sel{outline:2px solid var(--accent)}
.card.locked{opacity:.5}
.qhead{display:flex;align-items:center;gap:12px}
.qicon{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.stars{color:var(--st);font-size:13px;letter-spacing:2px}
.qname{font-size:17px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2);color:#C9CED1}
.row{display:flex;align-items:center;gap:10px}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wcard{background:var(--panel);border-radius:14px;padding:12px 8px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:120px}
.wcard.on{border-color:var(--accent)}
.wcard b{font-size:15px}
.wthumb{width:64px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.lv{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px dashed var(--line)}
.slot.filled{border-style:solid;border-color:var(--panel2)}
.cost{display:flex;flex-wrap:wrap;gap:6px}
.cost span{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2)}
.cost span.short{color:var(--mon)}
.mat{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;background:var(--panel)}
.sw{width:22px;height:22px;border-radius:6px;flex:none}
.mat b{margin-left:auto;font-variant-numeric:tabular-nums}
.sect{font-size:13px;color:var(--muted);padding-top:6px}
#loadout{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--panel2)}
#loadout .lo{flex:1;font-size:13px;color:var(--muted);line-height:1.5}
#loadout .lo b{color:var(--text);font-size:15px}
/* hud */
#hud{position:absolute;inset:0;display:none;pointer-events:none;z-index:3}
#hud.on{display:block}
.box{background:rgba(12,15,17,.84);border:1px solid rgba(255,255,255,.08);border-radius:14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bar{height:10px;border-radius:5px;background:#2A3236;overflow:hidden;position:relative}
.bar>div{height:100%;transition:width .12s}
#hudTop{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
#row1{display:flex;gap:8px;align-items:stretch}
#me{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
#meHead{display:flex;align-items:center;gap:8px}
#wpIcon{width:26px;height:26px;border-radius:8px;background:#2A3236;display:flex;align-items:center;justify-content:center;flex:none}
#wpName{font-size:14px;font-weight:700}
#wpType{font-size:11px;color:var(--muted);padding:2px 7px;border-radius:6px;background:#2A3236}
#hpWrap{height:16px;border-radius:6px}
#hpRed{position:absolute;left:0;top:0;height:100%;background:#9a3e36;transition:width .3s}
#hpBar{position:relative}
#hpNum{position:absolute;right:6px;top:0;line-height:16px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
#stWrap{height:7px;border-radius:4px}
#buffs{display:flex;flex-wrap:wrap;gap:4px;min-height:0}
.bf{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px 2px 5px;border-radius:999px;background:#2A3236;font-variant-numeric:tabular-nums}
.bf i{width:8px;height:8px;border-radius:50%;display:inline-block}
#side{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:76px}
#sideBtns{display:flex;gap:4px}#camBtn{flex:1;height:40px;border-radius:12px;border:1px solid rgba(79,179,191,.5);background:rgba(12,15,17,.84);color:#9fe0e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:9px;font-weight:700;pointer-events:auto;padding:0}
#camBtn.tps{background:rgba(79,179,191,.3);color:#fff}
#pauseBtn{width:32px;flex:none;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(12,15,17,.84);color:var(--text);display:flex;align-items:center;justify-content:center;pointer-events:auto}
#clock{text-align:center;padding:6px 0;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
#faintBox{display:flex;justify-content:center;gap:5px;padding:7px 0}
#faintBox i{width:12px;height:12px;border-radius:50%;background:var(--hp);display:inline-block}
#faintBox i.lost{background:#4a2a28;box-shadow:inset 0 0 0 2px var(--mon)}
#party{display:flex;flex-direction:column;gap:3px;align-self:flex-start;padding:0 2px}
#party .pm{display:flex;align-items:center;gap:5px;font-size:11px;background:rgba(12,15,17,.7);padding:3px 8px;border-radius:8px}
#party .pm i{width:8px;height:8px;border-radius:50%}
#party .pb{width:60px;height:5px;border-radius:3px;background:#2A3236;overflow:hidden}#party .pb div{height:100%;background:var(--hp)}
#lbIn{flex:1;min-height:52px;border-radius:12px;border:1px solid #2A3236;background:#14181A;color:var(--text);font-size:22px;letter-spacing:.3em;text-align:center}
#lbCode{font-family:'Dela Gothic One',sans-serif;font-size:44px;text-align:center;color:#9fe0e8;letter-spacing:.1em}
#lbErr{color:#ff9a8f;font-size:13px;text-align:center;min-height:18px}
.member{display:flex;align-items:center;gap:8px;background:#14181A;border-radius:10px;padding:10px 12px;font-size:14px}
.member .dot{width:10px;height:10px;border-radius:50%}.member b{flex:1}.member .mw{color:var(--muted);font-size:12px}.member .mr{font-size:11px;color:#9fe0e8}
#netBar{display:none;align-items:center;gap:8px;background:rgba(79,179,191,.15);border:1px solid rgba(79,179,191,.4);border-radius:10px;padding:6px 10px;font-size:12px;color:#9fe0e8;margin-bottom:8px}
#netBar span{flex:1}
#goHunt:disabled{opacity:.5}
#monBox{padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
#monHead{display:flex;align-items:center;gap:8px}
#monName{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.rage{background:#5a1f1c;color:#ff9a8f}.st.stun{background:#5a4a12;color:#FFD166}.st.flinch{background:#1f3d4f;color:#9fe0ff}.st.dead{background:#2A3236;color:var(--muted)}
#monBox .bar{height:9px}
#monBar{background:linear-gradient(90deg,#c2453a,#E2574C)}
#alert{align-self:center;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(120,24,20,.88);border:1px solid #ff6b5e;color:#fff;font-size:14px;font-weight:700;opacity:0;transform:translateY(-4px);transition:opacity .12s,transform .12s}
#alert.on{opacity:1;transform:none}
#alert svg{flex:none}
#wpCard{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(250px + env(safe-area-inset-bottom,0px));width:124px;padding:5px 8px;display:flex;flex-direction:column;gap:4px;background:rgba(20,24,26,.62);border-radius:10px;pointer-events:none}
#wpCard.hide,#wpCard.idle{display:none}
#wpCard #wcLabel{font-size:10px}#wpCard #wcMode{font-size:10px;padding:1px 6px}#wpCard #wcBar{height:5px}#wpCard #wcPips i{height:6px;border-radius:2px}#wpCard #wcPips{gap:3px}#wpCard #wcText{display:none}
#wpCard .note{width:9px!important;height:9px!important}
#wcHead{display:flex;align-items:center;gap:6px}
#wcLabel{font-size:12px;color:var(--muted);flex:1}
#wcMode{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#2A3236}
#wcMode:empty{display:none}
#wcBar{height:8px}
#wcPips{display:flex;gap:5px;align-items:center}
#wcPips:empty{display:none}
#wcPips i{flex:1;height:10px;border-radius:3px;background:#2A3236}
#wcText{font-size:12px;color:#D5DADC;line-height:1.4;white-space:pre-line}
#wcText:empty{display:none}
.note{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;vertical-align:-1px}
#touchZone{position:absolute;left:0;top:32%;bottom:0;width:44%;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid rgba(243,239,230,.4);background:rgba(12,15,17,.32);left:22px;bottom:calc(40px + env(safe-area-inset-bottom,0px));pointer-events:none}
#knob{position:absolute;left:38px;top:38px;width:56px;height:56px;border-radius:50%;background:rgba(243,239,230,.88)}
#btns{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:236px;height:236px;pointer-events:auto}
.rb{position:absolute;border-radius:50%;font-weight:700;font-size:13px;color:var(--text);background:rgba(12,15,17,.72);border:2px solid rgba(243,239,230,.8);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;padding:0 4px;text-align:center}
.rb svg{display:block}
.rb .cap,#skCap{font-size:10px;letter-spacing:.1em;font-weight:700;line-height:1}
.rb.press{transform:scale(.92);filter:brightness(1.25)}
.rb.off{opacity:.45}
#bAtk{right:0;bottom:0;width:104px;height:104px;background:var(--accent);color:var(--bg);border:none;font-size:17px}
#bAtk2{right:8px;bottom:114px;width:80px;height:80px;background:#3a2a14;border-color:var(--accent);color:#FFD9A0}
#bAtk2 .cap{color:var(--accent)}
#bAtk2 b{font-size:12px}
#bSkill{right:112px;bottom:70px;width:82px;height:82px;border:none;background:conic-gradient(var(--cool) calc(var(--g,0)*1%),#2A3236 0)}
#bSkill span{position:absolute;inset:5px;border-radius:50%;background:rgba(12,15,17,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:0 4px;text-align:center;gap:1px}
#bSkill.ready span{background:var(--cool);color:#0E1113}
#skCap{color:var(--cool)}
#bSkill.ready #skCap{color:#0E1113}
#skName{font-size:12px;line-height:1.15}
#bSkill.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#bRoll{right:118px;bottom:0;width:66px;height:66px;font-size:12px}
#bHeal{right:150px;bottom:162px;width:56px;height:56px;border-color:var(--hp);font-size:11px}
#nums{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.num{position:absolute;font-weight:700;font-size:19px;text-shadow:0 2px 3px #000,0 0 2px #000;transform:translate(-50%,-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.num.big{font-size:27px}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--disp);font-size:30px;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .3s;padding:0 20px}
#banner.on{opacity:1}
#hint{position:absolute;left:24px;right:24px;top:46%;margin-top:30px;text-align:center;font-size:13px;color:#fff;background:rgba(12,15,17,.7);border-radius:10px;padding:8px 12px;opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(200,30,30,.55);opacity:0;transition:opacity .3s}
#pause{position:absolute;inset:0;background:rgba(12,15,17,.9);display:none;flex-direction:column;justify-content:center;gap:12px;padding:40px 28px;pointer-events:auto}
#pause.on{display:flex}
#pauseHelp{white-space:pre-line;text-align:left;background:var(--panel);border-radius:12px;padding:14px;color:#D5DADC;font-size:13px;line-height:1.7}
#wPrevWrap{position:relative;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 60%,#2A3439,#161B1E 70%);overflow:hidden}
#wPrev{width:100%;height:100%;display:block}
#wPrevName{position:absolute;left:12px;top:10px;font-family:var(--disp);font-size:20px}
#wPrevTag{position:absolute;right:12px;top:12px;display:flex;gap:6px}
/* result */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.loot.rare{outline:2px solid var(--accent)}
#toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#bSkill.ready{animation:none}}
</style>

<div id="app">
<canvas id="c"></canvas>

<div id="hud">
  <div id="vign"></div>
  <div id="nums"></div>
  <div id="hudTop">
    <div id="row1">
      <div id="me" class="box">
        <div id="meHead"><div id="wpIcon"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 36 36" id="wpIconSvg"></svg></div><p id="wpName">大剣</p><p id="wpType">溜め斬り</p></div>
        <div id="hpWrap" class="bar"><div id="hpRed"></div><div id="hpBar" style="width:100%;background:var(--hp)"></div><span id="hpNum">150/150</span></div>
        <div id="stWrap" class="bar"><div id="stBar" style="width:100%;background:var(--st)"></div></div>
        <div id="buffs"></div>
      </div>
      <div id="side">
        <div id="sideBtns"><button id="camBtn" aria-label="視点切替"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span id="camLbl">俯瞰</span></button><button id="pauseBtn" aria-label="一時停止"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg></button></div>
        <p class="box" id="clock">00:00</p>
        <div class="box" id="faintBox" aria-label="残り力尽き回数"><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="monBox" class="box">
      <div id="monHead"><p id="monName"></p><span id="monState"></span></div>
      <div class="bar"><div id="monBar" style="width:100%"></div></div>
    </div>
    <div id="party"></div>
    <div id="alert"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 L22 20 H2 Z"/><path d="M12 10 V14 M12 17.5 V17.6"/></svg><span id="alertText"></span></div>
  </div>
  <p id="hint"></p>
  <div id="banner"></div>
  <div id="wpCard" class="box">
    <div id="wcHead"><p id="wcLabel"></p><span id="wcMode"></span></div>
    <div id="wcBar" class="bar"><div id="wcFill" style="width:0%"></div></div>
    <div id="wcPips"></div>
    <p id="wcText"></p>
  </div>
  <div id="touchZone"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button class="rb" id="bAtk" aria-label="攻撃"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M5 19 L17 7"/><path d="M14 4 L20 10"/><path d="M4 16 L8 20"/></svg>攻撃</button>
    <button class="rb" id="bAtk2" aria-label="攻撃B"><small class="cap">攻撃B</small><b id="a2Name">攻撃B</b></button>
    <button class="rb" id="bRoll" aria-label="回避"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 a8 8 0 1 1 -3 -6.2"/><path d="M20 4 V9 H15"/></svg>回避</button>
    <button class="rb" id="bSkill" aria-label="スキル"><span><small id="skCap">スキル</small><b id="skName">スキル</b></span></button>
    <button class="rb" id="bHeal" aria-label="回復薬"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 3 H15 M10 3 V8 L6 14 A5 5 0 0 0 10.5 21 H13.5 A5 5 0 0 0 18 14 L14 8 V3"/></svg>×<b id="potN">10</b></button>
  </div>
  <div id="pause">
    <h2 style="font-size:28px;text-align:center">一時停止</h2>
    <p id="pauseHelp"></p>
    <button class="btn primary" id="resume">続ける</button>
    <button class="btn ghost" id="quit">狩猟をやめる</button>
  </div>
</div>

<section class="screen on pad" id="sTitle">
  <div class="inner">
    <p class="eyebrow">HUNTING ACTION</p>
    <h1>マルチ<br>ハンター</h1>
    <p class="muted" style="font-size:15px">14の武器から一つを選び、巨大な獣を狩れ。</p>
    <div style="height:18px"></div>
    <button class="btn primary" id="startBtn">ひとりで遊ぶ</button>
    <button class="btn ghost" id="coopBtn" style="border:1px solid rgba(79,179,191,.6);color:#9fe0e8">協力プレイ(最大4人)</button>
    <p class="muted" style="text-align:center;font-size:12px">PC: WASD 移動 / J 攻撃A / U 攻撃B / K スキル / Space 回避 / E 回復</p>
  </div>
</section>

<section class="screen pad" id="sLobby">
  <div id="hubHead"><h2>協力プレイ</h2><button class="btn ghost small" id="lbBack">タイトル</button></div>
  <div style="display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto">
    <div id="lbStart" class="card" style="gap:14px">
      <p class="muted" style="font-size:14px">仲間と同じ部屋に入って、一緒に狩りに出ます。</p>
      <button class="btn primary" id="lbMake">部屋を作る</button>
      <p class="sect" style="text-align:center">または部屋コードで参加</p>
      <div style="display:flex;gap:8px"><input id="lbIn" inputmode="numeric" maxlength="4" placeholder="4桁のコード" autocomplete="off"><button class="btn ghost small" id="lbJoin" style="min-height:52px;width:96px">参加</button></div>
    </div>
    <div id="lbRoom" class="card" style="display:none;gap:12px">
      <p class="sect">部屋コード</p>
      <p id="lbCode">- - - -</p>
      <p class="muted" id="lbRole" style="font-size:13px"></p>
      <div id="lbMembers" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn primary" id="lbGear">装備を選ぶ</button>
      <button class="btn ghost" id="lbLeave">部屋を出る</button>
    </div>
    <p id="lbErr"></p>
  </div>
</section>

<section class="screen pad" id="sSelect">
  <div id="hubHead"><h2>出撃準備</h2><button class="btn ghost small" id="selBack">タイトル</button></div>
  <div id="netBar"><span id="netBarText"></span><button class="btn ghost small" id="netLeave" style="min-height:30px;padding:0 10px;font-size:12px">退出</button></div>
  <div id="hubBody">
    <div class="card" id="wPrevCard" style="padding:8px;position:sticky;top:0;z-index:5;box-shadow:0 -14px 0 8px var(--bg,#14181A)"><div id="wPrevWrap"><canvas id="wPrev"></canvas><p id="wPrevName"></p><div id="wPrevTag"></div></div></div>
    <p class="sect">武器を選ぶ</p>
    <div id="wGrid" class="wgrid"></div>
    <div class="card" style="padding:10px"><div id="wInfo" style="display:flex;flex-direction:column;gap:8px;padding:4px 4px 2px"></div></div>
    <p class="sect">狩猟対象</p>
    <div id="mList" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>
  <div id="loadout"><div class="lo" id="loLine"></div><button class="btn primary" id="goHunt" style="width:150px">出撃</button></div>
</section>

<section class="screen pad" id="sResult" style="gap:16px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:24px">
    <p class="eyebrow" id="rEyebrow">QUEST CLEAR</p>
    <h1 id="rTitle" style="font-size:44px;color:var(--accent)">討伐成功</h1>
    <p class="muted" id="rMon" style="font-size:15px"></p>
  </div>
  <div class="grid2">
    <div class="stat"><p class="muted">タイム</p><b id="rTime">00:00</b></div>
    <div class="stat"><p class="muted">評価</p><b id="rRank">-</b></div>
  </div>
  <div id="rLoot" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1"></div>
  <button class="btn primary" id="again">もう一度狩る</button>
  <button class="btn ghost" id="home">武器・相手を変える</button>
</section>
<div id="toast"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
// ===================================================================
//  マルチハンター  engine: scene, audio, fx, monsters, player core
// ===================================================================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const d2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const ARENA_R = 21;

// ---------------- renderer / scene ----------------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 220);
function resize() { const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
const hemi = new THREE.HemisphereLight('#dfefff', '#3b4a2f', 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e0', 0.95);
sun.position.set(14, 28, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 70 });
scene.add(sun);
const matCache = {};
const mat = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));
const basic = (c, o = 1) => new THREE.MeshBasicMaterial({ color: c, transparent: o < 1, opacity: o, depthWrite: o >= 1 });

const ARENAS = {
  grass: { sky: '#8FB0B4', fog: [32, 75], outer: '#4E6B45', inner: '#5A7A4E', hemi: ['#dfefff', '#3b4a2f'], sun: '#fff4e0', prop: 'tree', rock: '#6b6a5e', leaf: '#2f5a3a' },
  snow: { sky: '#B8C9D6', fog: [26, 65], outer: '#AFC0CB', inner: '#D3DEE6', hemi: ['#eef6ff', '#7d8c99'], sun: '#ffffff', prop: 'pine', rock: '#8a98a3', leaf: '#3c5a5a' },
  volcano: { sky: '#4A2E2A', fog: [24, 60], outer: '#2E2522', inner: '#4A3B36', hemi: ['#ffb27a', '#2a1a16'], sun: '#ffc48a', prop: 'spire', rock: '#3a2f2b', leaf: '#a33a1a' },
};
let arenaGroup = null;
function buildArena(key) {
  const A = ARENAS[key];
  if (arenaGroup) scene.remove(arenaGroup);
  arenaGroup = new THREE.Group(); scene.add(arenaGroup);
  scene.background = new THREE.Color(A.sky); scene.fog = new THREE.Fog(A.sky, A.fog[0], A.fog[1]);
  hemi.color.set(A.hemi[0]); hemi.groundColor.set(A.hemi[1]); sun.color.set(A.sun);
  const g = new THREE.Mesh(new THREE.CircleGeometry(ARENA_R + 34, 48), mat(A.outer)); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; arenaGroup.add(g);
  const inner = new THREE.Mesh(new THREE.CircleGeometry(ARENA_R, 64), mat(A.inner)); inner.rotation.x = -Math.PI / 2; inner.position.y = 0.01; inner.receiveShadow = true; arenaGroup.add(inner);
  // ground patches
  for (let i = 0; i < 26; i++) {
    const a = i * 2.39996, r = Math.sqrt((i + 0.5) / 26) * (ARENA_R - 2);
    const pt = new THREE.Mesh(new THREE.CircleGeometry(0.6 + (i % 4) * 0.35, 10), mat(A.outer));
    pt.rotation.x = -Math.PI / 2; pt.position.set(Math.cos(a) * r, 0.015, Math.sin(a) * r); pt.receiveShadow = true; arenaGroup.add(pt);
  }
  for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2 + (i % 3) * 0.05, r = ARENA_R + 1.6 + (i % 4) * 1.3;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (i % 2) {
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1 + (i % 3) * 0.6), mat(A.rock));
      rock.position.set(x, 0.6, z); rock.rotation.set(i, i * 2, 0); rock.castShadow = true; arenaGroup.add(rock);
    } else if (A.prop === 'spire') {
      const s = new THREE.Mesh(new THREE.ConeGeometry(0.9, 4 + (i % 5), 6), mat(A.rock)); s.position.set(x, 2, z); s.castShadow = true; arenaGroup.add(s);
      if (i % 4 === 0) { const lava = new THREE.Mesh(new THREE.CircleGeometry(1.6, 12), basic('#ff6a2a')); lava.rotation.x = -Math.PI / 2; lava.position.set(x * 0.95, 0.03, z * 0.95); arenaGroup.add(lava); }
    } else {
      const t = new THREE.Group();
      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 1.6), mat('#5b4532')); tr.position.y = 0.8;
      const lf = new THREE.Mesh(new THREE.ConeGeometry(A.prop === 'pine' ? 1.2 : 1.5, A.prop === 'pine' ? 4.4 : 3.6, 7), mat(A.leaf)); lf.position.y = 3; lf.castShadow = true;
      t.add(tr, lf);
      if (A.prop === 'pine') { const cap = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.4, 7), mat('#f3f7fa')); cap.position.y = 4.6; t.add(cap); }
      t.position.set(x, 0, z); arenaGroup.add(t);
    }
  }
}

// ---------------- audio ----------------
let AC = null, noiseBuf = null, master = null;
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 1.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();

}
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
function noise(t, dur, freq, type, peak) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); env(g, t, 0.005, peak, dur); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
function tone(t, dur, freq, type, peak, toFreq) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  const g = AC.createGain(); env(g, t, 0.01, peak, dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function sfx(k) {
  if (!AC) return; const t = AC.currentTime;
  switch (k) {
    case 'swing': noise(t, 0.12, 1800, 'bandpass', 0.25); break;
    case 'heavySwing': noise(t, 0.22, 700, 'bandpass', 0.35); break;
    case 'hit': noise(t, 0.08, 2500, 'highpass', 0.5); tone(t, 0.1, 180, 'triangle', 0.4, 80); break;
    case 'heavy': noise(t, 0.18, 900, 'lowpass', 0.7); tone(t, 0.25, 120, 'sine', 0.7, 40); break;
    case 'weak': tone(t, 0.12, 900, 'square', 0.12, 1300); break;
    case 'blunt': tone(t, 0.18, 90, 'sine', 0.8, 40); noise(t, 0.1, 600, 'lowpass', 0.5); break;
    case 'shot': noise(t, 0.05, 3000, 'highpass', 0.35); tone(t, 0.06, 500, 'square', 0.08, 200); break;
    case 'bigshot': noise(t, 0.25, 800, 'lowpass', 0.7); tone(t, 0.3, 160, 'sawtooth', 0.25, 50); break;
    case 'arrow': noise(t, 0.1, 4000, 'bandpass', 0.2); break;
    case 'boom': noise(t, 0.5, 400, 'lowpass', 0.9); tone(t, 0.4, 70, 'sine', 0.8, 30); break;
    case 'guard': tone(t, 0.15, 820, 'square', 0.15, 600); noise(t, 0.08, 3000, 'highpass', 0.3); break;
    case 'roar': tone(t, 1.1, 110, 'sawtooth', 0.35, 60); tone(t, 1.1, 165, 'sawtooth', 0.2, 80); noise(t, 1.0, 500, 'bandpass', 0.3); break;
    case 'hurt': tone(t, 0.2, 300, 'square', 0.15, 120); break;
    case 'heal': [523, 659, 784].forEach((f, i) => tone(t + i * 0.08, 0.25, f, 'sine', 0.2)); break;
    case 'note1': tone(t, 0.35, 523, 'triangle', 0.3); break;
    case 'note2': tone(t, 0.35, 659, 'triangle', 0.3); break;
    case 'melody': [523, 659, 784, 1046].forEach((f, i) => tone(t + i * 0.1, 0.4, f, 'triangle', 0.22)); break;
    case 'charge1': tone(t, 0.12, 600, 'sine', 0.2); break;
    case 'charge2': tone(t, 0.12, 800, 'sine', 0.22); break;
    case 'charge3': tone(t, 0.18, 1100, 'sine', 0.25); break;
    case 'morph': tone(t, 0.15, 300, 'square', 0.12, 900); noise(t, 0.1, 2000, 'highpass', 0.2); break;
    case 'reload': tone(t, 0.05, 1200, 'square', 0.1); tone(t + 0.12, 0.05, 900, 'square', 0.1); break;
    case 'step': noise(t, 0.25, 200, 'lowpass', 0.6); break;
    case 'fire': noise(t, 0.3, 900, 'bandpass', 0.25); break;
    case 'win': [392, 523, 659, 784, 1046].forEach((f, i) => tone(t + i * 0.12, 0.5, f, 'triangle', 0.25)); break;
    case 'lose': [392, 330, 262].forEach((f, i) => tone(t + i * 0.2, 0.5, f, 'triangle', 0.25)); break;
  }
}

// ---------------- particles / decals / numbers ----------------
const partGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
const parts = [];
function sparks(x, y, z, color, n = 8, spd = 6, life = 0.35, size = 1) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, basic(color, 0.95)); m.scale.setScalar(size);
    m.position.set(x, y, z); scene.add(m);
    const a = Math.random() * Math.PI * 2, u = Math.random() * 0.9 + 0.2;
    parts.push({ m, vx: Math.cos(a) * spd * u, vy: (Math.random() * 0.8 + 0.4) * spd * 0.8, vz: Math.sin(a) * spd * u, t: life, life, g: 18 });
  }
}
function puff(x, z, color = '#c9bba0', n = 10, r = 1) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, basic(color, 0.8)); m.scale.setScalar(2 + Math.random() * 2);
    const a = Math.random() * Math.PI * 2; m.position.set(x + Math.cos(a) * r, 0.3, z + Math.sin(a) * r); scene.add(m);
    parts.push({ m, vx: Math.cos(a) * 3, vy: 1.5, vz: Math.sin(a) * 3, t: 0.6, life: 0.6, g: 0 });
  }
}
function updateParts(dt) {
  for (const p of parts) {
    p.t -= dt; p.vy -= p.g * dt; p.m.position.x += p.vx * dt; p.m.position.y = Math.max(0.05, p.m.position.y + p.vy * dt); p.m.position.z += p.vz * dt;
    p.m.material.opacity = Math.max(0, p.t / p.life); if (p.t <= 0) { scene.remove(p.m); p.m.material.dispose(); }
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].t <= 0) parts.splice(i, 1);
}
const decalGeo = {
  rect: (() => { const g = new THREE.PlaneGeometry(1, 1); g.translate(0.5, 0, 0); return g; })(),
  circle: new THREE.CircleGeometry(1, 40),
  ring: new THREE.RingGeometry(0.9, 1, 56),
};
const sectorGeoCache = {};
function sectorGeo(arc) { const k = arc.toFixed(2); return sectorGeoCache[k] || (sectorGeoCache[k] = new THREE.CircleGeometry(1, 24, -arc / 2, arc)); }
const decals = [];
function decal(kind, o) {
  const geo = kind === 'sector' ? sectorGeo(o.arc) : decalGeo[kind];
  const m = new THREE.Mesh(geo, basic(o.color || '#E2574C', 0.3)); m.rotation.x = -Math.PI / 2; m.renderOrder = 2;
  scene.add(m); const d = { kind, m, o, t: 0 }; decals.push(d); placeDecal(d); return d;
}
function placeDecal(d) {
  const o = d.o, m = d.m; m.position.set(o.x, 0.05 + decals.indexOf(d) * 0.002, o.z);
  if (d.kind === 'rect') { m.scale.set(o.len, o.w, 1); m.rotation.z = -o.face; m.position.x = o.x; }
  else if (d.kind === 'sector') { m.scale.set(o.r, o.r, 1); m.rotation.z = -o.face; }
  else m.scale.set(o.r, o.r, 1);
  if (d.kind === 'rect') { // shift so rect is centered across width
    const nx = -Math.sin(o.face), nz = Math.cos(o.face); m.position.x = o.x; m.position.z = o.z; void nx; void nz;
  }
}
function killDecal(d) { if (!d) return; scene.remove(d.m); d.m.material.dispose(); const i = decals.indexOf(d); if (i >= 0) decals.splice(i, 1); }
function updateDecals(dt) { for (const d of decals) { d.t += dt; d.m.material.opacity = 0.22 + 0.14 * Math.sin(d.t * 14); } }

const tmpV = new THREE.Vector3();
const nums = [];
function popNum(x, y, z, txt, col, big) {
  const el = document.createElement('div'); el.className = 'num' + (big ? ' big' : ''); el.textContent = txt; el.style.color = col;
  $('nums').appendChild(el); nums.push({ el, x, y, z, t: 0.8 });
}
function renderNums(dt) {
  const r = canvas.getBoundingClientRect();
  for (const n of nums) {
    n.t -= dt; n.y += dt * 1.6; tmpV.set(n.x, n.y, n.z).project(camera);
    n.el.style.left = ((tmpV.x + 1) / 2 * r.width) + 'px'; n.el.style.top = ((1 - tmpV.y) / 2 * r.height) + 'px';
    n.el.style.opacity = Math.min(1, n.t * 3); if (n.t <= 0) n.el.remove();
  }
  for (let i = nums.length - 1; i >= 0; i--) if (nums[i].t <= 0) nums.splice(i, 1);
}
let bannerT = 0, hintT = 0;
function banner(txt, t) { const b = $('banner'); b.textContent = txt; b.classList.add('on'); bannerT = t; }
function hint(txt, t) { const b = $('hint'); b.textContent = txt; b.classList.add('on'); hintT = t; }
function fmt(t) { const s = Math.floor(t); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

// ---------------- monster rigs ----------------
function rigBase() { const root = new THREE.Group(), body = new THREE.Group(); root.add(body); scene.add(root); return { root, body, legs: [], segs: [], wings: [], extra: [] }; }
function addTail(R, parentPos, n, rad, skin, tip, len = 0.9) {
  const tail = new THREE.Group(); tail.position.copy(parentPos); R.body.add(tail); R.tail = tail;
  let parent = tail;
  for (let i = 0; i < n; i++) {
    const g = new THREE.Group(); g.position.x = i ? -len : 0;
    const m = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.15, rad - i * rad / (n + 1)), 10, 8), skin); m.scale.x = 1.6; m.position.x = -len / 2; m.castShadow = true;
    g.add(m); parent.add(g); parent = g; R.segs.push(g);
  }
  if (tip) { tip.position.x = -len - 0.2; parent.add(tip); }
}
function buildGolmuga() {
  const R = rigBase(); const skin = new THREE.MeshLambertMaterial({ color: '#8A7556' }), light = new THREE.MeshLambertMaterial({ color: '#A08A68' }), dark = mat('#5D4E3A');
  R.skins = [[skin, '#8A7556', '#9c4a33'], [light, '#A08A68', '#b05a40']];
  const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), skin); torso.scale.set(2.3, 1.3, 1.6); torso.position.y = 1.8; torso.castShadow = true; R.body.add(torso);
  const head = new THREE.Group(); head.position.set(2.4, 1.9, 0); R.head = head; R.body.add(head);
  const skull = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 1.1), light); skull.castShadow = true;
  const jaw = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.3, 0.9), dark); jaw.position.set(0.25, -0.5, 0); R.jaw = jaw;
  R.eyeM = basic('#FFDD55'); R.eyeCols = ['#FFDD55', '#ff3b3b'];
  const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.11), R.eyeM); e1.position.set(0.55, 0.15, 0.45); const e2 = e1.clone(); e2.position.z = -0.45;
  const h1 = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.8, 6), dark); h1.position.set(-0.2, 0.6, 0.35); h1.rotation.z = -0.6; const h2 = h1.clone(); h2.position.z = -0.35;
  head.add(skull, jaw, e1, e2, h1, h2);
  for (let i = 0; i < 5; i++) { const s = new THREE.Mesh(new THREE.ConeGeometry(0.34, 1.15, 5), dark); s.position.set(-1.4 + i * 0.75, 3.05 - Math.abs(i - 2) * 0.15, 0); s.castShadow = true; R.body.add(s); }
  for (const [x, z] of [[1.2, 1], [1.2, -1], [-1.2, 1], [-1.2, -1]]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 1.4, 8), dark); l.position.set(x, 0.7, z); l.castShadow = true; R.body.add(l); R.legs.push(l); }
  addTail(R, new THREE.Vector3(-2.1, 1.7, 0), 4, 0.55, skin, new THREE.Mesh(new THREE.DodecahedronGeometry(0.55), dark));
  return R;
}

    try { return id ? new Peer(id, { debug: 0 }) : new Peer({ debug: 0 }); } catch (e) { err('この環境では協力プレイを使えません(公開ページから開いてください)'); return null; }

  N.join = code => {
    if (!/^\d{4}$/.test(code)) { err('4桁の数字を入れてください'); return; }
    N.leave(); err('接続しています…');
    peer = makePeer(); if (!peer) return;
    peer.on('open', id => {
      N.myId = id; hostConn = peer.connect(PREFIX + code, { reliable: true });
      const to = setTimeout(() => { if (!N.guest) err('部屋が見つかりません。コードを確認してください。'); }, 9000);
      hostConn.on('open', () => { clearTimeout(to); Object.assign(N, { on: true, guest: true, code }); err(''); hostConn.send({ t: 'hello', wid: SAVE.w }); startTimer(); renderLobby(); });
      hostConn.on('data', onGuest);
      hostConn.on('close', () => {
        if (G) { banner('ホストとの接続が切れました', 3); setTimeout(() => { cleanupHunt(); N.leave(); show('sLobby'); }, 2500); }
        else { N.leave(); err('ホストとの接続が切れました'); }
      });
    });
    peer.on('error', e => err(e.type === 'peer-unavailable' ? '部屋が見つかりません。コードを確認してください。' : '通信エラー: ' + e.type));
  };

  N.setWeapon = wid => { if (!N.on) return; const r = N.roster.get(N.myId); if (r) r.wid = wid; if (N.host) sendRoster(); else N.send({ t: 'w', wid }); renderLobby(); };
  N.depart = () => { if (!N.host) return; N.send({ t: 'start', m: SAVE.m, r: [...N.roster] }); startHunt(); };
  N.onEnd = res => { if (N.host) N.send({ t: 'end', res }); };
  N.onMove = (m, def, mv) => {
    seq = (seq % 9999) + 1; m.seq = seq;
    N.send({ t: 'mv', i: m.def.moves.indexOf(def), rep: mv.rep, mt: +mv.t.toFixed(3), tx: mv.tx, tz: mv.tz, x: +m.x.toFixed(2), z: +m.z.toFixed(2), f: +m.face.toFixed(3), tg: m.tgt || N.myId });
  };

  // ---------- packets ----------
  function pack() {
    const p = G.p, c = p.cur;
    return { id: N.myId, x: +p.x.toFixed(2), z: +p.z.toFixed(2), y: +(p.y || 0).toFixed(2), f: +p.face.toFixed(2), a: p.act, at: +(p.actT || 0).toFixed(2),
      rd: p.roll ? p.roll.dur : 0, ra: p.roll && p.roll.air ? 1 : 0, w: W.id, n: c ? c.id : 0, nt: c ? +c.t.toFixed(2) : 0, nh: c ? +(c.holdT || 0).toFixed(2) : 0,
      mv: p.moving ? 1 : 0, hp: Math.round(p.hp), mh: p.maxHp };
  }
  function startTimer() {
    clearInterval(timer);
    timer = setInterval(() => {
      if (!G || !G.p) return;
      if (N.host) {
        const m = G.m;
        const ps = [pack(), ...[...N.last.values()]];
        N.send({ t: 's', m: { x: +m.x.toFixed(2), z: +m.z.toFixed(2), y: +m.y.toFixed(2), f: +m.face.toFixed(3), hp: Math.round(m.hp), mh: m.maxHp, rg: m.rage ? 1 : 0,
          st: +m.stunT.toFixed(2), fl: +m.flinchT.toFixed(2), ro: +(m.roarT || 0).toFixed(2), cr: +(m.crashT || 0).toFixed(2), wk: m.walk || 0, tg: m.tgt || N.myId, sq: m.move ? m.seq || 0 : 0 },
          ps, fa: G.faints, tm: +G.time.toFixed(2) });
      } else if (N.guest) N.send({ t: 'p', p: pack() });
    }, 66);
  }

  function onHost(c, d) {
    if (d.t === 'hello') {
      if (N.roster.size >= 4) return;
      const used = new Set([...N.roster.values()].map(r => r.slot)); let slot = 0; while (used.has(slot)) slot++;
      N.roster.set(c.peer, { name: 'ハンター' + (slot + 1), wid: String(d.wid || 'gs'), slot }); sendRoster(); renderNetBar();
    } else if (d.t === 'w') { const r = N.roster.get(c.peer); if (r && WMAP[d.wid]) { r.wid = d.wid; sendRoster(); } }
    else if (d.t === 'p' && G) { N.last.set(c.peer, d.p); applyGhost(d.p); }
    else if (d.t === 'dmg' && G && !G.m.dead) {
      const v = clamp(d.d | 0, 0, 400); G.m.flash = 0.08;
      popNum(G.m.x + (Math.random() - 0.5) * 2, 3 + Math.random(), G.m.z + (Math.random() - 0.5) * 2, v, '#bcd8dc');
      applyMonsterDamage(v, !!d.w, clamp(+d.ko || 0, 0, 80));
    } else if (d.t === 'faint' && G && !G.end) { addFaint(); banner(N.name(c.peer) + 'が力尽きました', 1.6); }
  }
  function onGuest(d) {
    if (d.t === 'roster') { N.roster.clear(); for (const [id, r] of d.r) N.roster.set(id, r); renderLobby(); renderNetBar(); }
    else if (d.t === 'full') { err('部屋が満員か、狩猟中です'); }
    else if (d.t === 'start') { N.roster.clear(); for (const [id, r] of d.r) N.roster.set(id, r); SAVE.m = d.m; if (G) cleanupHunt(); startHunt(); }
    else if (!G) return;
    else if (d.t === 's') {
      nm = d.m; const m = G.m;
      m.hp = Math.min(m.hp, d.m.hp); if (d.m.hp > m.hp + 50 || d.m.hp < m.hp) m.hp = d.m.hp; m.maxHp = d.m.mh;
      if (d.m.rg && !m.rage) { m.rage = true; banner('怒り状態!', 1.4); sfx('roar'); shake = 1; }
      if (d.m.st > 0 && !(m.stunT > 0)) { clearMove(m); if (!d.m.cr) banner('スタン!', 1.2); }
      if (d.m.fl > 0 && !(m.flinchT > 0)) { clearMove(m); popNum(m.x, 4.2, m.z, 'ひるみ', '#bfe8ff'); }
      m.stunT = d.m.st; m.flinchT = d.m.fl; m.roarT = d.m.ro; m.crashT = d.m.cr; m.walk = d.m.wk; m.tgt = d.m.tg;
      if (!d.m.sq && m.move && m.move.phase === 'wind') clearMove(m);
      if (d.fa > G.faints) banner('仲間が力尽きました', 1.4);
      G.faints = d.fa; G.time = d.tm;
      for (const s of d.ps) if (s.id !== N.myId) applyGhost(s);
    } else if (d.t === 'mv') {
      const m = G.m, def = m.def.moves[d.i]; if (!def) return;
      clearMove(m); m.x = d.x; m.z = d.z; m.face = d.f; m.tgt = d.tg;
      startMove(m, def, d.rep, { t: d.mt, rep: d.rep, tx: d.tx, tz: d.tz });
    } else if (d.t === 'rain') {
      const m = G.m, def = (m.move && m.move.def.type === 'rain') ? m.move.def : m.def.moves.find(x => x.type === 'rain'); if (def) spawnRain(m, def, d.pts);
    } else if (d.t === 'end') { if (d.res === 'win') { G.m.dead = true; G.m.hp = 0; clearMove(G.m); clearHazards(); } endHunt(d.res); }
  }

  // guest: follow the host's monster, run moves locally for visuals and own hits
  N.guestMonster = dt => {
    const m = G.m; m.flash = Math.max(0, m.flash - dt);
    if (m.dead) { m.deathT += dt; return; }
    if (nm) {
      const act = m.move && m.move.phase === 'act' && /charge|pounce|bite/.test(m.move.type);
      const k = 1 - Math.pow(act ? 0.3 : 0.004, dt);
      m.x += (nm.x - m.x) * k; m.z += (nm.z - m.z) * k; m.face += angDiff(nm.f, m.face) * k; if (!act) m.y += (nm.y - m.y) * k;
    }
    if (m.stunT > 0) { m.stunT -= dt; clearMove(m); return; }
    if (m.flinchT > 0) { m.flinchT -= dt; clearMove(m); return; }
    if (m.roarT > 0) { m.roarT -= dt; roarCover(m); return; }
    if (m.move) updateMove(m, dt);
  };

  // ---------- ghosts (other hunters) ----------
  function makeGhost(id, wid) {
    const rig = makeHunter(); try { WM.build[wid](rig); } catch (e) {}
    rig.root.children.forEach(o => { if (o.geometry && o.geometry.type === 'ConeGeometry') o.visible = false; if (o.geometry && o.geometry.type === 'RingGeometry') { o.material = o.material.clone(); o.material.color.set(N.color(id)); } });
    return { id, wid, rig, x: 0, z: 0, y: 0, face: 0, act: null, hp: 150, maxHp: 150, seen: 0, s: null, fake: { w: {}, buffs: {}, roll: { dur: 0.5 } } };
  }
  N.setupHunt = () => {
    G.ghosts = new Map(); if (!N.on) return;
    for (const [id, r] of N.roster) if (id !== N.myId) G.ghosts.set(id, makeGhost(id, r.wid));
  };
  function dropGhost(id) { const g = G.ghosts.get(id); if (g) { scene.remove(g.rig.root); G.ghosts.delete(id); } }
  N.dropAll = () => { if (G && G.ghosts) for (const id of [...G.ghosts.keys()]) dropGhost(id); };
  function applyGhost(s) {
    if (!G || !G.ghosts) return; let g = G.ghosts.get(s.id);
    if (!g) { if (!N.roster.has(s.id)) return; g = makeGhost(s.id, s.w); G.ghosts.set(s.id, g); g.x = s.x; g.z = s.z; }
    if (!g.s) { g.x = s.x; g.z = s.z; g.face = s.f; }
    const f = g.fake, prevN = g.s && g.s.n;
    g.s = s; g.seen = 0; g.act = s.a; g.hp = s.hp; g.maxHp = s.mh;
    f.act = s.a; f.actT = s.at; f.roll = { dur: s.rd || 0.5, air: !!s.ra }; f.moving = s.mv;
    const nd = s.n && WMAP[s.w] && WMAP[s.w].nodes[s.n];
    if (nd) { if (!f.cur || prevN !== s.n || Math.abs(f.cur.t - s.nt) > 0.15) f.cur = { id: s.n, n: nd, t: s.nt, holdT: s.nh }; } else f.cur = null;
  }
  N.renderGhosts = dt => {
    if (!G || !G.ghosts) return;
    const w0 = W;
    for (const g of G.ghosts.values()) {
      g.seen += dt; const R = g.rig; R.root.visible = !!g.s && g.seen < 4; if (!g.s) continue;
      const s = g.s, k = 1 - Math.pow(0.0005, dt);
      g.x += (s.x - g.x) * k; g.z += (s.z - g.z) * k; g.y += (s.y - g.y) * k; g.face += angDiff(s.f, g.face) * k;
      const f = g.fake; if (f.cur) { f.cur.t += dt; if (f.cur.n.hold) f.cur.holdT += dt; } if (f.act && f.actT != null) f.actT += dt;
      R.root.position.set(g.x, g.y, g.z); R.root.rotation.y = -g.face;
      try { W = WMAP[g.wid] || w0; animHunter(R, f); } catch (e) {} W = w0;
    }
  };

  // ---------- UI ----------
  function renderLobby() {
    const inRoom = N.on;
    $('lbStart').style.display = inRoom ? 'none' : 'flex';
    $('lbRoom').style.display = inRoom ? 'flex' : 'none';
    if (!inRoom) return;
    $('lbCode').textContent = N.code.split('').join(' ');
    $('lbRole').textContent = N.host ? 'このコードを仲間に伝えてください(最大4人)' : '参加しました。ホストの出撃を待ちます';
    $('lbMembers').innerHTML = [...N.roster.entries()].sort((a, b) => a[1].slot - b[1].slot).map(([id, r]) => {
      const w = WMAP[r.wid];
      return `<div class="member"><span class="dot" style="background:${SLOT_COL[r.slot]}"></span><b>${r.name}${id === N.myId ? '(あなた)' : ''}</b><span class="mw">${w ? w.name : ''}</span><span class="mr">${r.slot === 0 ? 'ホスト' : '参加中'}</span></div>`;
    }).join('');
  }
  function renderNetBar() {
    const bar = $('netBar'); if (!bar) return;
    bar.style.display = N.on ? 'flex' : 'none';
    if (N.on) $('netBarText').textContent = `協力 部屋 ${N.code} ・ ${N.roster.size}人` + (N.guest ? ' ・ 狩猟対象はホストが決めます' : '');
    const gh = $('goHunt'); if (gh) { gh.disabled = N.guest; gh.textContent = N.guest ? '出撃待ち' : N.host ? '全員で出撃' : '出撃'; }
    $('mList').style.pointerEvents = N.guest ? 'none' : ''; $('mList').style.opacity = N.guest ? 0.5 : 1;
  }
  N.renderNetBar = renderNetBar;
  N.renderParty = () => {
    const el = $('party'); if (!N.on || !G || !G.ghosts || !G.ghosts.size) { if (el.innerHTML) el.innerHTML = ''; return; }
    el.innerHTML = [...G.ghosts.values()].map(g => `<div class="pm"><i style="background:${N.color(g.id)}"></i><span>${N.name(g.id)}</span><div class="pb"><div style="width:${g.act === 'faint' ? 0 : clamp(g.hp / g.maxHp, 0, 1) * 100}%"></div></div></div>`).join('');
  };
  $('lbMake').onclick = () => { audioInit(); N.create(); };
  $('lbJoin').onclick = () => { audioInit(); N.join($('lbIn').value.trim()); };
  $('lbBack').onclick = () => { show('sTitle'); };
  $('lbLeave').onclick = () => { N.leave(); err(''); };
  $('lbGear').onclick = () => { renderSelect(); show('sSelect'); };
  $('netLeave').onclick = () => { N.leave(); renderSelect(); };
  renderLobby();
  return N;
})();
</script>
</body></html>
